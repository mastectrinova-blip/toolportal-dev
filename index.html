<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tri NOVA</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --navy-950: #060a16;
        --navy-900: #0b1120;
        --navy-800: #111a2e;
        --navy-700: #182338;
        --navy-600: #233049;
        --slate-500: #3c4a66;
        --slate-400: #5b6b8a;
        --slate-300: #8a97b0;
        --ink-50: #f8fafc;
        --ink-100: #eef1f7;
        --blue-500: #3b6ef6;
        --blue-600: #2c57d6;
        --blue-400: #5e8bff;
        --green-500: #18b06b;
        --green-100: #d8f5e6;
        --green-800: #0c6b40;
        --red-500: #e5484d;
        --red-100: #fbdcdd;
        --red-800: #99201f;
        --amber-500: #e0a32a;
        --amber-100: #faedcb;
        --amber-800: #8a5e0a;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 18px;
        --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px rgba(15, 23, 42, 0.06);
        --shadow-pop: 0 12px 32px rgba(8, 12, 24, 0.28);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--ink-50);
        color: var(--navy-900);
        -webkit-font-smoothing: antialiased;
      }

      #root { min-height: 100vh; }

      ::selection { background: rgba(59, 110, 246, 0.25); }

      a { color: inherit; text-decoration: none; }
      button { font-family: inherit; cursor: pointer; }
      input { font-family: inherit; }

      .mono { font-family: 'JetBrains Mono', monospace; }
      .display { font-family: 'Hanken Grotesk', 'Inter', sans-serif; }

      .msym {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 20px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        vertical-align: middle;
        -webkit-font-feature-settings: 'liga';
        font-feature-settings: 'liga';
        -moz-osx-font-smoothing: grayscale;
      }

      /* ---------- Scrollbar ---------- */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.25); border-radius: 8px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.4); }

      /* ---------- Shared button styles ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 18px;
        transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .btn:active { transform: scale(0.98); }
      .btn-primary { background: var(--blue-500); color: white; box-shadow: 0 4px 14px rgba(59, 110, 246, 0.32); }
      .btn-primary:hover { background: var(--blue-600); }
      .btn-ghost { background: transparent; border-color: rgba(148, 163, 184, 0.35); color: var(--navy-700); }
      .btn-ghost:hover { background: rgba(148, 163, 184, 0.1); }
      .btn-block { width: 100%; }

      /* ---------- Animated network bg (login) ---------- */
      @keyframes pulse-node {
        0%, 100% { opacity: 0.55; r: 4; }
        50% { opacity: 1; r: 6; }
      }
      @keyframes drift {
        0% { transform: translate(0, 0); }
        50% { transform: translate(6px, -8px); }
        100% { transform: translate(0, 0); }
      }
      @keyframes fadein {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      .fade-in { animation: fadein 0.5s ease both; }
      .spin { animation: spin 0.8s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        .fade-in, .spin, .pulse-node, .drift-grp { animation: none !important; }
      }
    </style>
  </head>

    if (!username.trim() || !password.trim()) {
      setError("Enter your email and password to continue.");
      return;
    }
    setError("");
    setLoading(true);
    const { data, error: authError } = await sb.auth.signInWithPassword({
      email: username.trim(),
      password: password,
    });
    if (authError) {
      setLoading(false);
      setError(authError.message);
      return;
    }
    const profile = await loadProfile(data.user);
    setLoading(false);
    onLogin(profile);
  }

  return (
    <div style={{ display: "flex", minHeight: "100vh", width: "100%" }}>
      {/* Left panel */}
      <div
        style={{
          flex: "1 1 50%",
          position: "relative",

          display: "none",
        }}

      >
        <NetworkScene />
        <div style={{ position: "relative", zIndex: 2, height: "100%", display: "flex", flexDirection: "column", padding: "48px 56px", color: "white" }}>

            <div style={{display: "flex", alignItems: "center", justifyContent: "center" }}>
                <img src={LOGO_SRC} alt="Tri NOVA" style={{ width: 90, height: 90, objectFit: "contain"}}/>
            </div>
            <span className="display" style={{ fontWeight: 700, fontSize: 42, letterSpacing: "-0.01em" }}>Tri NOVA</span>
          </div>

          <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", maxWidth: 460 }}>
            <h1 className="display fade-in" style={{ fontSize: 52, lineHeight: 1.05, fontWeight: 800, margin: 0, letterSpacing: "-0.02em" }}>
              Automate.<br />Validate.<br />Accelerate.
            </h1>
          </div>
        </div>
      </div>

      {/* Right panel */}
      <div style={{ flex: "1 1 50%", display: "flex", alignItems: "center", justifyContent: "center", background: "var(--ink-50)", padding: "32px 24px" }}>
        <div style={{ width: "100%", maxWidth: 380 }} className="fade-in">
          <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginBottom: 28 }}>
            <h2 className="display" style={{ fontSize: 26, fontWeight: 700, margin: 0, letterSpacing: "-0.01em" }}>Welcome back</h2>
            <p style={{ fontSize: 14, color: "var(--slate-400)", marginTop: 6 }}>Sign in to continue</p>
          </div>

          <form onSubmit={handleSubmit}>
            <label style={{ display: "block", fontSize: 13, fontWeight: 600, color: "var(--navy-700)", marginBottom: 6 }}>Email</label>
            <div style={{ position: "relative", marginBottom: 16 }}>
              <span className="msym" style={{ position: "absolute", left: 14, top: 11, fontSize: 19, color: "var(--slate-400)" }}>person</span>
              <input
                value={username}
                onChange={(e) => setUsername(e.target.value)}
                type="email"
                placeholder="  "
                style={inputStyle}
                onFocus={(e) => (e.target.style.borderColor = "var(--blue-500)")}
                onBlur={(e) => (e.target.style.borderColor = "rgba(148,163,184,0.4)")}
              />
            </div>

            <label style={{ display: "block", fontSize: 13, fontWeight: 600, color: "var(--navy-700)", marginBottom: 6 }}>Password</label>
            <div style={{ position: "relative", marginBottom: 8 }}>
              <span className="msym" style={{ position: "absolute", left: 14, top: 11, fontSize: 19, color: "var(--slate-400)" }}>lock</span>
              <input
                type={showPw ? "text" : "password"}
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                placeholder="••••••••"
                style={inputStyle}
                onFocus={(e) => (e.target.style.borderColor = "var(--blue-500)")}
                onBlur={(e) => (e.target.style.borderColor = "rgba(148,163,184,0.4)")}
              />
              <button
                type="button"
                aria-label={showPw ? "Hide password" : "Show password"}
                onClick={() => setShowPw((s) => !s)}
                style={{ position: "absolute", right: 10, top: 7, background: "transparent", border: "none", padding: 6 }}
              >
                <span className="msym" style={{ fontSize: 19, color: "var(--slate-400)" }}>
                  {showPw ? "visibility_off" : "visibility"}
                </span>
              </button>
            </div>

            {error && (
              <p style={{ color: "var(--red-500)", fontSize: 13, margin: "4px 0 12px" }}>{error}</p>
            )}

            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", margin: "12px 0 20px" }}>
              <label style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 13, color: "var(--slate-400)", cursor: "pointer" }}>
                <input type="checkbox" checked={remember} onChange={(e) => setRemember(e.target.checked)} style={{ width: 15, height: 15, accentColor: "var(--blue-500)" }} />

        @media (min-width: 880px) {

    </div>
  );

    function onClick(e) {
      if (ref.current && !ref.current.contains(e.target)) setMenuOpen(false);
    }
    document.addEventListener("mousedown", onClick);
    return () => document.removeEventListener("mousedown", onClick);
  }, []);

  return (
    <div
      style={{
        height: 64,
        borderBottom: "1px solid rgba(148,163,184,0.2)",
        background: "white",
        display: "flex",

          <img
    src="assests/logo.png"

      width: 30,
      height: 30
    }}

        <span className="display" style={{ fontWeight: 700, fontSize: 17, letterSpacing: "-0.01em" }}>{brand || "Tri NOVA"}</span>

      <nav style={{ display: "flex", gap: 22, flex: 1 }}>

            <button
              key={key}
              onClick={() => onNavigate(key)}
              style={{
                background: "none",
                border: "none",
                fontSize: 14.5,
                fontWeight: 600,
                color: isActive ? "var(--blue-500)" : "var(--slate-400)",

      </nav>





      <div ref={ref} style={{ position: "relative" }}>

          onClick={() => setMenuOpen((o) => !o)}

              {user.email}

          </div>
        </button>

        {menuOpen && (
          <div
            style={{
              position: "absolute",
              right: 0,
              top: 46,
              background: "white",
              border: "1px solid rgba(148,163,184,0.25)",
              borderRadius: 10,
              boxShadow: "var(--shadow-pop)",

              padding: 6,
            }}
          >

function Dashboard({ user, onNavigate, onLogout, onElevate, onOpenTool }) {

  const [pin, setPin] = useState("");
  const [pinError, setPinError] = useState("");

  function handleElevateSubmit(e) {
    e.preventDefault();
    if (pin.trim().length < 4) {
      setPinError("Enter the 4+ digit admin PIN to continue.");
      return;
    }
    setPinError("");
    // Real admin access is granted via the `role` column on your Supabase
    // `profiles` table, not a client-side PIN — this just routes to the
    // admin area, which will show an access-denied screen for non-admins.
    setElevating(false);
    onNavigate("admin");
  }

  return (
    <div style={{ minHeight: "100vh", background: "var(--ink-50)" }}>

          {TOOLS.map((tool) => (
            <ToolCard key={tool.id} tool={tool} onLaunch={setLaunchedTool} onOpenTool={onOpenTool} />
          ))}
        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr", gap: 20 }} className="dash-grid">
          <div style={{ background: "white", border: "1px solid rgba(148,163,184,0.18)", borderRadius: 16, padding: "22px 24px", boxShadow: "var(--shadow-card)" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
              <h2 className="display" style={{ fontSize: 16, fontWeight: 700, margin: 0 }}>Latest Releases</h2>
              <button style={{ background: "none", border: "none", fontSize: 13, fontWeight: 600, color: "var(--blue-500)", display: "flex", alignItems: "center", gap: 4 }}>
              </button>
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              {RECENT_UPDATES.map((item, i) => (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: 14, padding: "12px 8px", borderRadius: 10 }}>
                  <div style={{ width: 38, height: 38, borderRadius: 10, background: "var(--ink-100)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                    <span className="msym" style={{ fontSize: 19, color: "var(--blue-500)" }}>{item.icon}</span>
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 14, fontWeight: 600 }}>{item.title}</div>
                    <div className="mono" style={{ fontSize: 11.5, color: "var(--slate-400)", marginTop: 2 }}>{item.subtitle}</div>
                  </div>
                  <button aria-label="More options" style={{ background: "none", border: "none", color: "var(--slate-400)" }}>
                    <span className="msym" style={{ fontSize: 19 }}>more_vert</span>
                  </button>
                </div>
              ))}
            </div>
          </div>


        </div>
      </div>

      {launchedTool && (
        <Modal onClose={() => setLaunchedTool(null)}>
          <div style={{ width: 46, height: 46, borderRadius: 12, background: "var(--ink-100)", display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 16 }}>
            <span className="msym" style={{ fontSize: 24, color: "var(--blue-500)" }}>{launchedTool.icon}</span>

          <p style={{ fontSize: 14, color: "var(--slate-400)", lineHeight: 1.6, margin: "0 0 22px" }}>

          <button onClick={() => setLaunchedTool(null)} className="btn btn-primary btn-block" style={{ height: 42 }}>
            Got it

        </Modal>

      {elevating && (
        <Modal onClose={() => setElevating(false)}>

      <style>{`

// Hosts an independently-maintained tool (NR-BL, Audits, etc.) inside the
// SPA via <iframe>. The tool file itself is untouched aside from its back
// button, which posts a `trinova:navigate` message that App listens for.

        {children}

}

function App() {
  const [user, setUser] = useState(null);
  const [route, setRoute] = useState(() => sessionStorage.getItem("trinova:route") || "dashboard");
  const [activeTool, setActiveTool] = useState(() => {
    const savedId = sessionStorage.getItem("trinova:toolId");
    return savedId ? TOOLS.find(t => t.id === savedId) || null : null;
  });

  useEffect(() => {
    sessionStorage.setItem("trinova:route", route);
    if (activeTool) sessionStorage.setItem("trinova:toolId", activeTool.id);
    else sessionStorage.removeItem("trinova:toolId");
  }, [route, activeTool]);

  function openTool(tool) {
    setActiveTool(tool);
    setRoute("tool-frame");
  }

  function backFromTool() {
    setActiveTool(null);
    setRoute("dashboard");
  }

  // Listen for the embedded tool's "Back to Tri NOVA" button, which posts
  // a trinova:navigate message instead of doing a (previously broken)
  // full-page navigation. This is the sole integration point between the
  // SPA shell and the independently-maintained tool files.
  useEffect(() => {
    function onMessage(e) {
      if (e.data && e.data.type === "trinova:navigate" && e.data.target === "dashboard") {
        backFromTool();
      }
    }
    window.addEventListener("message", onMessage);
    return () => window.removeEventListener("message", onMessage);
  }, []);

  const [checkingSession, setCheckingSession] = useState(true);

  // On first load (including returning from an embedded tool iframe via
  // ?skip_login=true), check Supabase for an existing session so the user
  // isn't forced to log in again on every page/refresh.
  useEffect(() => {
    async function restoreSession() {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        const profile = await loadProfile(session.user);
        setUser(profile);
      }
      setCheckingSession(false);

      const params = new URLSearchParams(window.location.search);
      if (params.get("skip_login") === "true") {
        window.history.replaceState({}, "", window.location.pathname);
      }
    }
    restoreSession();

    // Keep `user` in sync if the session is refreshed or expires elsewhere
    // (e.g. another tab, or a token refresh).
    const { data: listener } = sb.auth.onAuthStateChange(async (event, session) => {
      if (event === "SIGNED_OUT") {
        setUser(null);
      }
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  function handleLogin(profile) {
    setUser(profile);
    setRoute("dashboard");
  }

  async function handleLogout() {
    await sb.auth.signOut();
    sessionStorage.removeItem("trinova:route");
    sessionStorage.removeItem("trinova:toolId");
    setUser(null);
    setRoute("dashboard");
  }

  function handleNavigate(target) {
    if (target === "admin-login") {
      setRoute("admin-gate");
      return;
    }
    setRoute(target);
  }

  if (checkingSession) {
    return (
      <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: "var(--slate-400)", fontSize: 14 }}>
        Loading…
      </div>
    );
  }

  if (!user) {
    return <Login onLogin={handleLogin} />;
  }

  if (route === "admin" || route === "admin-gate") {
    return <Admin user={user} onNavigate={handleNavigate} onLogout={handleLogout} />;
  }

  if (route === "tool-frame" && activeTool) {
    return <ToolFrame tool={activeTool} onBack={backFromTool} />;
  }

  return (
    <Dashboard
      user={user}
      onNavigate={handleNavigate}
      onLogout={handleLogout}
      onOpenTool={openTool}
    />
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 18px;
        transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      }
      .btn:active { transform: scale(0.98); }
      .btn-primary { background: var(--blue-500); color: white; box-shadow: 0 4px 14px rgba(59, 110, 246, 0.32); }
      .btn-primary:hover { background: var(--blue-600); }
      .btn-ghost { background: transparent; border-color: rgba(148, 163, 184, 0.35); color: var(--navy-700); }
      .btn-ghost:hover { background: rgba(148, 163, 184, 0.1); }
      .btn-block { width: 100%; }

      /* ---------- Animated network bg (login) ---------- */
      @keyframes pulse-node {
        0%, 100% { opacity: 0.55; r: 4; }
        50% { opacity: 1; r: 6; }
      }
      @keyframes drift {
        0% { transform: translate(0, 0); }
        50% { transform: translate(6px, -8px); }
        100% { transform: translate(0, 0); }
      }
      @keyframes fadein {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      .fade-in { animation: fadein 0.5s ease both; }
      .spin { animation: spin 0.8s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        .fade-in, .spin, .pulse-node, .drift-grp { animation: none !important; }
      }
    </style>

function NetworkScene() {
  const nodes = [
    { x: 70, y: 90, r: 5, delay: 0 },
    { x: 230, y: 60, r: 4, delay: 0.4 },
    { x: 340, y: 170, r: 6, delay: 0.8 },
    { x: 150, y: 230, r: 4, delay: 1.1 },
    { x: 300, y: 320, r: 5, delay: 0.6 },
    { x: 90, y: 380, r: 4, delay: 1.4 },
    { x: 380, y: 420, r: 5, delay: 0.2 },
    { x: 210, y: 440, r: 3.5, delay: 1.7 },
  ];
  const edges = [
    [0, 1], [1, 2], [2, 4], [4, 6], [3, 1], [3, 5], [5, 7], [4, 7], [2, 6],
  ];
  return (
    <svg viewBox="0 0 420 480" style={{ position: "absolute", inset: 0, width: "100%", height: "100%" }} preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <radialGradient id="nodeglow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stopColor="#5e8bff" stopOpacity="0.9" />
          <stop offset="100%" stopColor="#5e8bff" stopOpacity="0" />
        </radialGradient>
      </defs>
      {edges.map(([a, b], i) => (
        <line
          key={i}
          x1={nodes[a].x}
          y1={nodes[a].y}
          x2={nodes[b].x}
          y2={nodes[b].y}
          stroke="rgba(94,139,255,0.28)"
          strokeWidth="1"
        />
      ))}
      {nodes.map((n, i) => (
        <g key={i} style={{ animation: `drift ${5 + i}s ease-in-out infinite`, animationDelay: `${n.delay}s` }} className="drift-grp">
          <circle cx={n.x} cy={n.y} r={n.r * 4} fill="url(#nodeglow)" />
          <circle
            cx={n.x}
            cy={n.y}
            r={n.r}
            fill="#bcd0ff"
            className="pulse-node"
            style={{ animation: `pulse-node ${2.4 + (i % 3) * 0.5}s ease-in-out infinite`, animationDelay: `${n.delay}s` }}
          />
        </g>
      ))}
    </svg>
  );
}

            <p style={{ marginTop: 22, fontSize: 16, color: "var(--slate-300)", lineHeight: 1.6, maxWidth: 380 }}>
              Streamline your network operations with one connected workspace for tools, audits, and team access.

          </div>

          <p className="mono" style={{ fontSize: 12, color: "var(--slate-400)", margin: 0 }}>
            © 2026 ToolPortal. All rights reserved.

            <p style={{ fontSize: 14, color: "var(--slate-400)", marginTop: 6 }}>Sign in to continue to ToolPortal</p>
          </div>

          <form onSubmit={handleSubmit}>

      </div>

        }
      `}</style>
    </div>
  );
}

function TopBar({ user, onNavigate, onLogout, active, brand }) {
  const [menuOpen, setMenuOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    function onClick(e) {
      if (ref.current && !ref.current.contains(e.target)) setMenuOpen(false);
    }
    document.addEventListener("mousedown", onClick);
    return () => document.removeEventListener("mousedown", onClick);
  }, []);

  return (
    <div
      style={{
        height: 64,
        borderBottom: "1px solid rgba(148,163,184,0.2)",
        background: "white",
        display: "flex",
        alignItems: "center",
        padding: "0 28px",
        gap: 28,
        position: "sticky",
        top: 0,
        zIndex: 30,
      }}
    >
      <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
        <div style={{ width: 30, height: 30, borderRadius: 8, background: "var(--navy-900)", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <span className="msym" style={{ color: "white", fontSize: 17 }}>bolt</span>
        </div>
        <span className="display" style={{ fontWeight: 700, fontSize: 17, letterSpacing: "-0.01em" }}>{brand || "ToolPortal"}</span>
      </div>

      <nav style={{ display: "flex", gap: 22, flex: 1 }}>
        {["Dashboard"].map((label) => {
          const key = label.toLowerCase();
          const isActive = active === key;
          return (
            <button
              key={key}
              onClick={() => onNavigate(key)}
              style={{
                background: "none",
                border: "none",
                fontSize: 14.5,
                fontWeight: 600,
                color: isActive ? "var(--blue-500)" : "var(--slate-400)",
                padding: "8px 0",
                position: "relative",
              }}
            >
              {label}
              {isActive && (
                <span style={{ position: "absolute", left: 0, right: 0, bottom: -1, height: 2, background: "var(--blue-500)", borderRadius: 2 }} />
              )}
            </button>
          );
        })}
      </nav>





      <div ref={ref} style={{ position: "relative" }}>
        <button
          onClick={() => setMenuOpen((o) => !o)}
          style={{ display: "flex", alignItems: "center", gap: 9, background: "none", border: "none", padding: "4px 4px 4px 0" }}
        >
          <div style={{ width: 32, height: 32, borderRadius: "50%", background: "var(--navy-700)", color: "white", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12.5, fontWeight: 700 }}>
            {user.initials}
          </div>
          <div style={{ textAlign: "left" }}>
            <div style={{ fontSize: 13.5, fontWeight: 600, lineHeight: 1.2 }}>{user.name}</div>
            <div className="mono" style={{ fontSize: 11, color: "var(--slate-400)", lineHeight: 1.2 }}>
              {user.role === "admin" ? "System Admin" : "Standard Operator"}
            </div>
          </div>
        </button>

        {menuOpen && (
          <div
            style={{
              position: "absolute",
              right: 0,
              top: 46,
              background: "white",
              border: "1px solid rgba(148,163,184,0.25)",
              borderRadius: 10,
              boxShadow: "var(--shadow-pop)",
              width: 190,
              padding: 6,
            }}
          >
            <button
              onClick={onLogout}
              style={{
                width: "100%",
                display: "flex",
                alignItems: "center",
                gap: 8,
                padding: "9px 10px",
                borderRadius: 7,
                background: "none",
                border: "none",
                fontSize: 13.5,
                fontWeight: 500,
                color: "var(--red-500)",
                textAlign: "left",
              }}
              onMouseEnter={(e) => (e.currentTarget.style.background = "var(--red-100)")}
              onMouseLeave={(e) => (e.currentTarget.style.background = "none")}
            >
              <span className="msym" style={{ fontSize: 17 }}>logout</span>
              Sign out
            </button>
          </div>
        )}
      </div>

      <style>{`
        @media (min-width: 1080px) {
          .topbar-search { display: block !important; }
        }
      `}</style>
    </div>
  );
}

function ToolCard({ tool, onLaunch, onOpenTool }) {
  function handleLaunch() {
    if (tool.src && onOpenTool) {

      onOpenTool(tool);

      onLaunch(tool);
    }
  }
  return (
    <div
      style={{
        background: "white",
        border: "1px solid rgba(148,163,184,0.18)",
        borderRadius: 16,
        overflow: "hidden",
        boxShadow: "var(--shadow-card)",
        display: "flex",
        flexDirection: "column",
      }}
    >
      <div
        style={{
          height: 88,
          background: "linear-gradient(135deg, var(--navy-800), var(--navy-900))",
          display: "flex",
          alignItems: "center",
          padding: "0 22px",

function Dashboard({ user, onNavigate, onLogout, onElevate, onOpenTool }) {
  const [launchedTool, setLaunchedTool] = useState(null);
  const [elevating, setElevating] = useState(false);
  const [pin, setPin] = useState("");
  const [pinError, setPinError] = useState("");

  function handleElevateSubmit(e) {
    e.preventDefault();
    if (pin.trim().length < 4) {
      setPinError("Enter the 4+ digit admin PIN to continue.");
      return;
    }
    setPinError("");
    onElevate();
    setElevating(false);
    onNavigate("admin");

  return (

        </div>

        <div style={{ display: "grid", gridTemplateColumns: "1.4fr 1fr", gap: 20 }} className="dash-grid">
          <div style={{ background: "white", border: "1px solid rgba(148,163,184,0.18)", borderRadius: 16, padding: "22px 24px", boxShadow: "var(--shadow-card)" }}>

              </button>

            <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>

                <div key={i} style={{ display: "flex", alignItems: "center", gap: 14, padding: "12px 8px", borderRadius: 10 }}>
                  <div style={{ width: 38, height: 38, borderRadius: 10, background: "var(--ink-100)", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                    <span className="msym" style={{ fontSize: 19, color: "var(--blue-500)" }}>{item.icon}</span>
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 14, fontWeight: 600 }}>{item.title}</div>
                    <div className="mono" style={{ fontSize: 11.5, color: "var(--slate-400)", marginTop: 2 }}>{item.subtitle}</div>
                  </div>
                  <button aria-label="More options" style={{ background: "none", border: "none", color: "var(--slate-400)" }}>
                    <span className="msym" style={{ fontSize: 19 }}>more_vert</span>
                  </button>
                </div>
              ))}

          </div>


        </div>

      {launchedTool && (
        <Modal onClose={() => setLaunchedTool(null)}>

            <span className="msym" style={{ fontSize: 24, color: "var(--blue-500)" }}>{launchedTool.icon}</span>
          </div>
          <h3 className="display" style={{ fontSize: 19, fontWeight: 700, margin: "0 0 8px" }}>{launchedTool.name}</h3>
          <p style={{ fontSize: 14, color: "var(--slate-400)", lineHeight: 1.6, margin: "0 0 22px" }}>
            This is a demo build, so {launchedTool.name} doesn't run live operations here — but this is where the tool's workspace would open.
          </p>
          <button onClick={() => setLaunchedTool(null)} className="btn btn-primary btn-block" style={{ height: 42 }}>
            Got it

        </Modal>
      )}

      {elevating && (
        <Modal onClose={() => setElevating(false)}>
          <div style={{ width: 46, height: 46, borderRadius: 12, background: "var(--ink-100)", display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 16 }}>
            <span className="msym" style={{ fontSize: 24, color: "var(--navy-900)" }}>shield_lock</span>
          </div>
          <h3 className="display" style={{ fontSize: 19, fontWeight: 700, margin: "0 0 8px" }}>Elevate to admin</h3>

              }}
            />

      <style>{`

          .dash-grid { grid-template-columns: 1fr !important; }

// Hosts an independently-maintained tool (NR-BL, Audits, etc.) inside the
// SPA via <iframe>. The tool file itself is untouched aside from its back
// button, which posts a `trinova:navigate` message that App listens for.
function ToolFrame({ tool, onBack }) {
  return (
    <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", background: "var(--ink-50)" }}>
      <div
        style={{
          height: 56,
          background: "white",
          borderBottom: "1px solid rgba(148,163,184,0.2)",
          display: "flex",
          alignItems: "center",
          padding: "0 20px",
          gap: 14,
          flexShrink: 0,
        }}
      >
        <button onClick={onBack} className="btn btn-ghost" style={{ padding: "7px 14px", fontSize: 13 }}>
          <span className="msym" style={{ fontSize: 17 }}>arrow_back</span>
          Back to Dashboard
        </button>
        <span style={{ fontSize: 13.5, color: "var(--slate-400)", fontWeight: 500 }}>
          ToolPortal &nbsp;/&nbsp; <strong style={{ color: "var(--navy-900)" }}>{tool.name}</strong>
        </span>
      </div>
      <iframe
        title={tool.name}
        src={tool.src}
        style={{ flex: 1, width: "100%", border: "none", display: "block" }}
      />

  );
}

function Modal({ children, onClose }) {
  return (
    <div
      style={{ position: "fixed", inset: 0, background: "rgba(8,12,24,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: 20 }}
      onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}
    >
      <div className="fade-in" style={{ background: "white", borderRadius: 16, padding: 28, width: "100%", maxWidth: 380, boxShadow: "var(--shadow-pop)" }}>
        {children}
      </div>
    </div>
  );
}

            </div>

            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 22px", flexWrap: "wrap", gap: 10 }}>
              <span style={{ fontSize: 13, color: "var(--slate-400)" }}>
                Showing <strong style={{ color: "var(--navy-900)" }}>{pageRows.length === 0 ? 0 : (page - 1) * pageSize + 1}</strong> to{" "}

                <strong style={{ color: "var(--navy-900)" }}>{filtered.length}</strong> members
              </span>
              <div style={{ display: "flex", gap: 6 }}>
                <button
                  onClick={() => setPage((p) => Math.max(1, p - 1))}
                  disabled={page === 1}
                  className="btn btn-ghost"
                  style={{ width: 34, height: 34, padding: 0, opacity: page === 1 ? 0.4 : 1 }}
                  aria-label="Previous page"
                >
                  <span className="msym" style={{ fontSize: 18 }}>chevron_left</span>
                </button>
                <button
                  onClick={() => setPage((p) => Math.min(totalPages, p + 1))}
                  disabled={page === totalPages}
                  className="btn btn-ghost"
                  style={{ width: 34, height: 34, padding: 0, opacity: page === totalPages ? 0.4 : 1 }}
                  aria-label="Next page"
                >
                  <span className="msym" style={{ fontSize: 18 }}>chevron_right</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <style>{`
        @media (min-width: 1080px) {
          .admin-search { display: block !important; }
        }
        @media (max-width: 760px) {
          .admin-shell { flex-direction: column; }
        }
      `}</style>
    </div>
  );
}

function AccessDenied({ onBack, onElevate }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");

  function handleSubmit(e) {
    e.preventDefault();
    if (pin.trim().length < 4) {
      setError("Enter the 4+ digit admin PIN to continue.");
      return;
    }
    setError("");
    onElevate();
  }

  return (
    <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "var(--navy-950)", padding: 24 }}>
      <div className="fade-in" style={{ maxWidth: 400, width: "100%", textAlign: "center", color: "white" }}>
        <div style={{ width: 64, height: 64, borderRadius: 18, background: "rgba(229,72,77,0.15)", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 22px" }}>
          <span className="msym" style={{ fontSize: 32, color: "var(--red-500)" }}>block</span>
        </div>
        <h1 className="display" style={{ fontSize: 23, fontWeight: 700, margin: "0 0 10px" }}>Admin access required</h1>
        <p style={{ fontSize: 14, color: "var(--slate-300)", lineHeight: 1.6, margin: "0 0 26px" }}>
          This area is restricted to system administrators. Enter the admin PIN to elevate this session, or head back to your dashboard.
        </p>

        <form onSubmit={handleSubmit} style={{ textAlign: "left" }}>
          <input
            value={pin}
            onChange={(e) => setPin(e.target.value)}
            placeholder="Admin PIN (any 4+ digits)"
            inputMode="numeric"
            style={{
              width: "100%",
              height: 44,
              borderRadius: 10,
              border: "1px solid rgba(148,163,184,0.35)",
              background: "rgba(255,255,255,0.05)",
              color: "white",
              padding: "0 14px",
              fontSize: 14,
              outline: "none",
              marginBottom: error ? 8 : 16,
            }}
          />
          {error && <p style={{ color: "#ff9a9d", fontSize: 13, margin: "0 0 14px" }}>{error}</p>}
          <button type="submit" className="btn btn-primary btn-block" style={{ height: 44, marginBottom: 10 }}>
            <span className="msym" style={{ fontSize: 18 }}>lock_open</span>
            Elevate access
          </button>
          <button type="button" onClick={onBack} className="btn btn-block" style={{ height: 44, background: "rgba(255,255,255,0.06)", color: "white", border: "1px solid rgba(255,255,255,0.12)" }}>
            Back to dashboard
          </button>
        </form>
      </div>
    </div>
  );
}

function App() {
  const [user, setUser] = useState(null);
  const [route, setRoute] = useState("dashboard");
  const [activeTool, setActiveTool] = useState(null);

  function openTool(tool) {
    setActiveTool(tool);
    setRoute("tool-frame");
  }

  function backFromTool() {
    setActiveTool(null);
    setRoute("dashboard");
  }

  // Listen for the embedded tool's "Back to ToolPortal" button, which posts
  // a trinova:navigate message instead of doing a (previously broken)
  // full-page navigation. This is the sole integration point between the
  // SPA shell and the independently-maintained tool files.
  useEffect(() => {
    function onMessage(e) {
      if (e.data && e.data.type === "trinova:navigate" && e.data.target === "dashboard") {
        backFromTool();
      }
    }
    window.addEventListener("message", onMessage);
    return () => window.removeEventListener("message", onMessage);
  }, []);

  // If returning from the audit tool via ?skip_login=true, restore the session
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    if (params.get("skip_login") === "true") {
      const savedName = sessionStorage.getItem("tp_username") || "User";
      const savedRole = sessionStorage.getItem("tp_role") || "operator";
      const initials = savedName.split(" ").map((p) => p[0]).join("").slice(0, 2).toUpperCase();
      setUser({ name: savedName, role: savedRole, initials, email: `${savedName.split(" ")[0].toLowerCase()}@toolportal.io` });
      setRoute("dashboard");
      // Clean the URL so refreshing doesn't keep the param
      window.history.replaceState({}, "", window.location.pathname);
    }
  }, []);

  function handleLogin(username, role) {
    const seed = username.trim() || (role === "admin" ? "Alex Rivera" : "Alex Mercer");
    const initials = seed.split(" ").map((p) => p[0]).join("").slice(0, 2).toUpperCase();
    sessionStorage.setItem("tp_username", seed);
    sessionStorage.setItem("tp_role", role);
    setUser({ name: seed, role, initials, email: `${seed.split(" ")[0].toLowerCase()}@toolportal.io` });
    setRoute("dashboard");
  }

  function handleLogout() {
    sessionStorage.removeItem("tp_username");
    sessionStorage.removeItem("tp_role");
    setUser(null);
    setRoute("dashboard");
  }

  function handleNavigate(target) {
    if (target === "admin-login") {
      setRoute("admin-gate");
      return;
    }
    setRoute(target);
  }

  function handleElevate() {
    setUser((u) => (u ? { ...u, role: "admin" } : u));
    setRoute("admin");
  }

  if (!user) {
    return <Login onLogin={handleLogin} />;
  }

  if (route === "admin") {
    if (user.role !== "admin") {
      return <AccessDenied onBack={() => setRoute("dashboard")} onElevate={handleElevate} />;
    }
    return <Admin user={user} onNavigate={handleNavigate} onLogout={handleLogout} />;
  }

  if (route === "admin-gate") {
    return <AccessDenied onBack={() => setRoute("dashboard")} onElevate={handleElevate} />;
  }

  if (route === "tool-frame" && activeTool) {
    return <ToolFrame tool={activeTool} onBack={backFromTool} />;
  }

  return (
    <Dashboard
      user={user}
      onNavigate={handleNavigate}
      onLogout={handleLogout}
      onElevate={handleElevate}
      onOpenTool={openTool}
    />
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
  </body>
</html>
